<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>有标签的工作交接 · 模板参考</title>
<style>
.flow{display:flex;align-items:center;gap:16px;margin-top:40px;max-width:1200px}
.flow .node{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;text-align:center;box-shadow:var(--shadow);position:relative}
.flow .node .ic{font-size:32px;margin-bottom:6px}
.flow .node h4{font-size:16px}
.flow .node p{font-size:12px;color:var(--text-3);margin:0}
.flow .arr{color:var(--text-3);font-size:28px;flex-shrink:0}
.flow .node.hl{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent),var(--shadow)}
</style>
<link rel="stylesheet" href="../reference.css">
</head>
<body>
<main class="reference">
<p class="kicker">版式参考 / 示意内容</p>
<h1>有标签的工作交接</h1>
<div class="flow">
  <div class="node"><h4>Agent</h4><p>整理查询条件</p></div>
  <div class="arr"><small>传参数</small><span aria-hidden="true">→</span></div>
  <div class="node"><h4>查询脚本</h4><p>返回 ID 与路径</p></div>
  <div class="arr"><small>返回线索</small><span aria-hidden="true">→</span></div>
  <div class="node hl"><h4>Agent</h4><p>选中页面并读来源</p></div>
</div>
<p class="caption">箭头表示数据交接。节点宽度和距离表示版式。</p>
<footer><a href="https://github.com/lewislulu/html-ppt-skill/blob/fd1629067909ff55b36b905476de4e5f26062a1f/templates/single-page/flow-diagram.html">html-ppt-skill 上游模板</a> · MIT · 已适配连续阅读与窄屏</footer>
</main>
</body>
</html>
